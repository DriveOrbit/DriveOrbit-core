# DriveOrbit Core - Application Configuration Template
# Copy this file to 'application.properties' and update with your actual values

spring.application.name=DriveOrbit-core

# Database Configuration
# Replace with your actual database details
spring.datasource.url=jdbc:postgresql://localhost:5432/YOUR_DATABASE_NAME
spring.datasource.username=YOUR_DATABASE_USERNAME
spring.datasource.password=YOUR_DATABASE_PASSWORD

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# WebSocket Configuration
spring.websocket.max-text-message-size=8192
spring.websocket.max-binary-message-size=8192

# Logging Configuration
# Set to INFO for production, DEBUG for development
logging.level.lk.driveorbit.DriveOrbit_core.config=INFO
logging.level.lk.driveorbit.DriveOrbit_core.vehicle.service=INFO
logging.level.lk.driveorbit.DriveOrbit_core.controller=INFO

# QR Code Configuration
qrcode.upload.dir=upload/qrcodes
app.baseUrl=http://localhost:8080

# Security: Never commit actual credentials!
# Use environment variables in production:
# spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/driveorbit}
# spring.datasource.username=${DATABASE_USERNAME:your_username}
# spring.datasource.password=${DATABASE_PASSWORD:your_password}
